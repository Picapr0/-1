<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121218" />
  <title>Text Fix</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <div class="app">
    <h1>Text Fix</h1>
    <p class="hint">Вставьте текст ниже и выберите тип правки</p>
    <ul class="menu-info">
      <li><strong>Грамматика</strong> — орфография, пунктуация, опечатки</li>
      <li><strong>Стиль</strong> — ясность, без воды и повторов</li>
      <li><strong>Деловой</strong> — вежливый официальный тон</li>
    </ul>
    <textarea id="text" rows="8" placeholder="Ваш текст…"></textarea>
    <button type="button" id="copy">Копировать</button>
    <div id="modes"></div>
    <p id="status" class="status"></p>
  </div>
  <div id="loader" hidden>
    <div class="spinner"></div>
    <p>Исправляем…</p>
  </div>
  <script src="app.js?v=6"></script>
</body>
</html>
